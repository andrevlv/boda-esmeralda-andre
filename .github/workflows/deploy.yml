name: Publicar invitación
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Armar sitio (une archivos grandes partidos)
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_parts' --exclude '_site' ./ _site/
          if [ -f _parts/manifest.txt ]; then
            while IFS='|' read -r target parts; do
              [ -z "$target" ] && continue
              mkdir -p "_site/$(dirname "$target")"
              : > "_site/$target"
              for p in $parts; do cat "_parts/$p" >> "_site/$target"; done
              echo "unido: $target ($(stat -c%s "_site/$target") bytes)"
            done < _parts/manifest.txt
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
